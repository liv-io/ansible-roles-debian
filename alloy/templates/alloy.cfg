{{ansible_managed|comment(decoration='#')}}

check process alloy matching "/usr/local/bin/alloy.*"
  start program = "/bin/systemctl start {{service_name_alloy}}"
  stop program = "/bin/systemctl stop {{service_name_alloy}}"
  if failed host 127.0.0.1 port 1514 type tcp with timeout 3 seconds for 3 cycles then alert
  if failed host 127.0.0.1 port 12345 type tcp with timeout 3 seconds for 3 cycles then alert
  if does not exist for 3 cycles then alert
