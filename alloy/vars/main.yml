---

# alloy_etc.dir
file_dst_alloy_etc_dir: '/etc/alloy'
file_mode_alloy_etc_dir: '0750'
file_owner_alloy_etc_dir: 'root'
file_group_alloy_etc_dir: 'alloy'

# alloy_opt.dir
file_dst_alloy_opt_dir: '/opt/alloy'
file_mode_alloy_opt_dir: '0750'
file_owner_alloy_opt_dir: 'alloy'
file_group_alloy_opt_dir: 'alloy'

# alloy.zip
file_src_alloy_zip: "https://github.com/grafana/alloy/releases/download/v{{alloy_version}}/alloy-linux-amd64.zip"
file_dst_alloy_zip: '/usr/local/src/alloy-linux-amd64.zip'
file_mode_alloy_zip: '0644'
file_owner_alloy_zip: 'root'
file_group_alloy_zip: 'root'
file_checksum_alloy_zip: "sha256:https://github.com/grafana/alloy/releases/download/v{{alloy_version}}/SHA256SUMS"

# alloy
file_src_alloy: "/usr/local/src/alloy-linux-amd64.zip"
file_dst_alloy: '/usr/local/bin'
file_mode_alloy: '0755'
file_owner_alloy: 'root'
file_group_alloy: 'root'
file_creates_alloy: '/usr/local/bin/alloy-linux-amd64'

# alloy.default
file_src_alloy_default: 'alloy.default'
file_dst_alloy_default: '/etc/default/alloy'
file_mode_alloy_default: '0644'
file_owner_alloy_default: 'root'
file_group_alloy_default: 'root'

# alloy.service
file_src_alloy_service: 'alloy.service'
file_dst_alloy_service: '/lib/systemd/system/alloy.service'
file_mode_alloy_service: '0644'
file_owner_alloy_service: 'root'
file_group_alloy_service: 'root'

# config.d
file_dst_config_d: '/etc/alloy/config.d'
file_mode_config_d: '0750'
file_owner_config_d: 'root'
file_group_config_d: 'alloy'

# config.alloy
file_dst_config_alloy: '/etc/alloy/config.alloy'
file_mode_config_alloy: '0640'
file_owner_config_alloy: 'root'
file_group_config_alloy: 'alloy'

# monit.d
file_dst_monit_d: '/etc/monit.d'
file_mode_monit_d: '0750'
file_owner_monit_d: 'root'
file_group_monit_d: 'root'

# nftables.d
file_dst_nftables_d: '/etc/nftables.d'
file_mode_nftables_d: '0750'
file_owner_nftables_d: 'root'
file_group_nftables_d: 'root'

# alloy.cfg
file_src_alloy_cfg: 'alloy.cfg'
file_dst_alloy_cfg: '/etc/monit.d/alloy.cfg'
file_mode_alloy_cfg: '0640'
file_owner_alloy_cfg: 'root'
file_group_alloy_cfg: 'root'

# alloy.nft
file_src_alloy_nft: 'alloy.nft'
file_dst_alloy_nft: '/etc/nftables.d/alloy.conf'
file_mode_alloy_nft: '0640'
file_owner_alloy_nft: 'root'
file_group_alloy_nft: 'root'

# alloy
group_name_alloy: 'alloy'
group_system_alloy: True

# alloy
user_name_alloy: 'alloy'
user_comment_alloy: 'Alloy'
user_group_alloy: 'alloy'
user_append_alloy: False
user_home_create_alloy: False
user_home_move_alloy: False
user_home_remove_alloy: True
user_home_force_alloy: False
user_password_alloy: '!'
user_password_update_alloy: 'always'
user_shell_alloy: '/usr/sbin/nologin'
user_system_alloy: True

# create config.alloy
command_cmd_create_config_alloy: 'find "{{file_dst_config_d}}" -maxdepth 1 -type f -iname "*\.alloy" | sort | xargs cat > "{{file_dst_config_alloy}}"'

# validate config.alloy
command_cmd_validate_config_alloy: '"{{file_creates_alloy}}" validate "{{file_dst_config_alloy}}"'

# check service alloy
command_cmd_check_service_alloy: 'systemctl cat alloy.service > /dev/null 2>&1'

# reload monit
command_cmd_reload_monit: 'systemctl is-active monit.service > /dev/null 2>&1 && systemctl reload monit || true'

# validate monit
command_cmd_validate_monit: 'systemctl is-active monit.service > /dev/null 2>&1 && monit -t || true'

# reload nftables
command_cmd_reload_nftables: 'systemctl is-active nftables.service > /dev/null 2>&1 && nft --file /etc/nftables.conf || true'

# validate nftables
command_cmd_validate_nftables: 'systemctl is-active nftables.service > /dev/null 2>&1 && nft --check --file /etc/nftables.conf || true'

# alloy
service_name_alloy: 'alloy'
