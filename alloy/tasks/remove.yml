---

- name: include variables
  include_vars: "{{lookup('first_found', params)}}"
  vars:
    params:
      files:
        - "vars/{{ansible_distribution_major_version}}.yml"
        - 'vars/main.yml'
  tags:
    - alloy

- name: check service alloy
  shell: "{{command_cmd_check_service_alloy}}"
  register: register_check_service_alloy
  changed_when: (register_check_service_alloy.rc == 0)
  failed_when: (register_check_service_alloy.rc > 1)
  check_mode: False
  tags:
    - alloy

- name: stop service alloy
  service:
    state: stopped
    enabled: False
    name: "{{service_name_alloy}}"
    daemon_reload: True
  when: (register_check_service_alloy.rc == 0)
  tags:
    - alloy

- name: remove user alloy
  user:
    state: absent
    name: "{{user_name_alloy}}"
    remove: "{{user_home_remove_alloy}}"
    force: "{{user_home_force_alloy}}"
  tags:
    - alloy

- name: remove group alloy
  group:
    state: absent
    name: "{{group_name_alloy}}"
  tags:
    - alloy

- name: remove file alloy.nft
  file:
    state: absent
    path: "{{file_dst_alloy_nft}}"
  notify: reload nftables
  tags:
    - alloy

- name: remove file alloy.cfg
  file:
    state: absent
    path: "{{file_dst_alloy_cfg}}"
  notify: reload monit
  tags:
    - alloy

- name: remove file alloy_etc.dir
  file:
    state: absent
    path: "{{file_dst_alloy_etc_dir}}"
  tags:
    - alloy

- name: remove file alloy.default
  file:
    state: absent
    path: "{{file_dst_alloy_default}}"
  tags:
    - alloy

- name: remove file alloy.service
  file:
    state: absent
    path: "{{file_dst_alloy_service}}"
  tags:
    - alloy

- name: remove file alloy
  file:
    state: absent
    path: "{{file_creates_alloy}}"
  tags:
    - alloy

- name: remove file alloy.zip
  file:
    state: absent
    path: "{{file_dst_alloy_zip}}"
  tags:
    - alloy
