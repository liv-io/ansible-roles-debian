---

- name: include variables
  include_vars: "{{lookup('first_found', params)}}"
  vars:
    params:
      files:
        - "vars/{{ansible_distribution_major_version}}.yml"
        - 'vars/main.yml'
  tags:
    - alloy

- name: create file config.alloy
  copy:
    content: ''
    force: False
    dest: "{{file_dst_config_alloy}}"
    mode: "{{file_mode_config_alloy}}"
    owner: "{{file_owner_config_alloy}}"
    group: "{{file_group_config_alloy}}"
  notify: restart service alloy
  tags:
    - alloy

- name: copy config.d
  copy:
    src: "files/"
    dest: "{{file_dst_config_d}}"
    mode: "{{file_mode_config_alloy}}"
    owner: "{{file_owner_config_alloy}}"
    group: "{{file_group_config_alloy}}"
  register: register_copy_alloy_d
  tags:
    - alloy

- name: create file config.alloy
  shell: "{{command_cmd_create_config_alloy}}"
  check_mode: False
  notify:
    - validate alloy
    - restart service alloy
  when: register_copy_alloy_d.changed
  tags:
    - alloy

- name: create file alloy.default
  template:
    src: "{{file_src_alloy_default}}"
    dest: "{{file_dst_alloy_default}}"
    mode: "{{file_mode_alloy_default}}"
    owner: "{{file_owner_alloy_default}}"
    group: "{{file_group_alloy_default}}"
  notify: restart service alloy
  tags:
    - alloy

- name: create file alloy.cfg
  template:
    src: "{{file_src_alloy_cfg}}"
    dest: "{{file_dst_alloy_cfg}}"
    mode: "{{file_mode_alloy_cfg}}"
    owner: "{{file_owner_alloy_cfg}}"
    group: "{{file_group_alloy_cfg}}"
  notify:
    - validate monit
    - reload monit
  when: (alloy_monit_state == True)
  tags:
    - alloy

- name: remove file alloy.cfg
  file:
    state: absent
    path: "{{file_dst_alloy_cfg}}"
  notify: reload monit
  when: (alloy_monit_state == False)
  tags:
    - alloy

- name: create file alloy.nft
  template:
    src: "{{file_src_alloy_nft}}"
    dest: "{{file_dst_alloy_nft}}"
    mode: "{{file_mode_alloy_nft}}"
    owner: "{{file_owner_alloy_nft}}"
    group: "{{file_group_alloy_nft}}"
  notify:
    - validate nftables
    - reload nftables
  when: (alloy_nftables_state == True)
  tags:
    - alloy

- name: remove file alloy.nft
  file:
    state: absent
    path: "{{file_dst_alloy_nft}}"
  notify: reload nftables
  when: (alloy_nftables_state == False)
  tags:
    - alloy

- name: start service alloy
  service:
    state: started
    enabled: True
    name: "{{service_name_alloy}}"
    daemon_reload: True
  tags:
    - alloy
